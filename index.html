<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мой Питомец</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100vh;
      overflow: hidden;
      background: #87CEEB; /* фон сцены — можно поставить картинку */
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #character {
      /* размер персонажа — подгоните под свои видео */
      height: 60vh;
      width: auto;
      background: transparent;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="character" autoplay loop muted playsinline></video>
  </div>
  <script src="script.js"></script>
</body>
</html>
